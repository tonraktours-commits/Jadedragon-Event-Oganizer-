<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadedragon Event OS V1.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f7f7f8;font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{max-width:1300px;margin:auto;padding:18px}.top,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.top{border-bottom:1px solid #333;padding-bottom:16px}.muted{color:#9ca3af}.btn{padding:10px 13px;border-radius:9px;border:1px solid #444;background:#17191f;color:#fff;font-weight:700}.red{background:#ff3045;border-color:#ff3045}.green{background:#55e69a;border-color:#55e69a;color:#07120c}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.card{background:#121419;border:1px solid #30343c;border-radius:14px;padding:15px}.stat b{font-size:24px;display:block}.layout{display:grid;grid-template-columns:300px 1fr;gap:12px}.project{padding:11px;border:1px solid #333;border-radius:10px;margin:8px 0}.project.active{border-color:#ff3045}.workflow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0}.step{border:1px solid #3a3d45;border-radius:8px;padding:9px;text-align:center;font-size:12px}.step.current{background:#42151b;border-color:#ff3045}.step.done{background:#123420;border-color:#36a46b}input,select,textarea{width:100%;padding:10px;background:#0d0f13;color:#fff;border:1px solid #3b3f48;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;color:#bbb}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #30343c;text-align:left;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{width:min(650px,100%);background:#121419;border:1px solid #444;border-radius:14px;padding:16px}.money{font-size:20px;font-weight:800}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.layout,.grid{grid-template-columns:1fr}.workflow{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="wrap">
<div class="top"><div><b>JADE<span style="color:#ff3045">DRAGON</span> EVENT OS</b><div class="muted">V1.3 · Project Workflow / Production Control</div></div><div><button class="btn" onclick="backup()">Export Backup</button> <button class="btn red" onclick="newProject()">+ New Project</button></div></div>
<div class="stats"><div class="card stat"><b id="sp">0</b><span class="muted">Projects</span></div><div class="card stat"><b id="sa">0</b><span class="muted">Active</span></div><div class="card stat"><b id="st">0</b><span class="muted">Open Tasks</span></div><div class="card stat"><b id="sv">฿0</b><span class="muted">Project Value</span></div><div class="card stat"><b id="sc">฿0</b><span class="muted">Estimated Cost</span></div></div>
<div class="layout"><div class="card"><div class="row"><h3>Projects</h3></div><div id="list"></div></div><div class="card" id="detail"><div style="text-align:center;padding:160px 10px"><h2>Jadedragon Event OS V1.3</h2><span class="muted">เลือก Project หรือสร้าง Project ใหม่</span></div></div></div></div>
<div class="modal" id="pm"><div class="box"><div class="row"><h3>Create Project</h3><button class="btn" onclick="pm.classList.remove('open')">✕</button></div><div class="grid">
<div><label>Project ID</label><input id="pid" readonly></div><div><label>Quotation No.</label><input id="pq"></div><div><label>ลูกค้า/บริษัท</label><input id="pc"></div><div><label>ชื่องาน</label><input id="pn"></div><div><label>ประเภทงาน</label><select id="pt"><option>Event</option><option>Concert</option><option>Government</option><option>Festival</option><option>Sport / Run</option><option>Production / Live</option></select></div><div><label>วันที่งาน</label><input id="pd" type="date"></div><div class="full"><label>สถานที่</label><input id="pv"></div><div><label>Project Value</label><input id="pval" type="number" value="0"></div><div><label>Estimated Cost</label><input id="pcost" type="number" value="0"></div><div class="full"><label>Project Brief</label><textarea id="pb"></textarea></div></div><p><button class="btn green" onclick="saveProject()">Create Project</button></p></div></div>
<div class="modal" id="tm"><div class="box"><div class="row"><h3>Add Production Task</h3><button class="btn" onclick="tm.classList.remove('open')">✕</button></div><div class="grid"><div class="full"><label>Task</label><input id="tn"></div><div><label>Department</label><select id="td"><option>Creative</option><option>Production</option><option>Operation</option><option>Supplier</option><option>Staff</option><option>Finance</option></select></div><div><label>Owner</label><input id="to"></div><div><label>Due Date</label><input id="tdate" type="date"></div><div><label>Cost</label><input id="tc" type="number" value="0"></div></div><p><button class="btn green" onclick="saveTask()">Add Task</button></p></div></div>
<script>
const K="JD_EVENT_OS_V13", stages=["Confirmed","Pre-Production","Production","Event Day","Billing","Completed"];let db=JSON.parse(localStorage.getItem(K)||'{"projects":[]}'),sel=null;
const M=n=>"฿"+Number(n||0).toLocaleString("th-TH");function save(){localStorage.setItem(K,JSON.stringify(db))}
function newProject(){pid.value="JD-P"+String(new Date().getFullYear()+543).slice(-2)+"-"+String(db.projects.length+1).padStart(4,"0");pm.classList.add("open")}
function saveProject(){db.projects.unshift({id:pid.value,q:pq.value,client:pc.value||"ไม่ระบุ",name:pn.value||"New Project",type:pt.value,date:pd.value,venue:pv.value,value:+pval.value||0,cost:+pcost.value||0,brief:pb.value,status:"Confirmed",tasks:[]});sel=pid.value;save();pm.classList.remove("open");render()}
function addTask(){tm.classList.add("open")}function saveTask(){let p=db.projects.find(x=>x.id==sel);p.tasks.push({id:Date.now(),name:tn.value||"New Task",dept:td.value,owner:to.value,due:tdate.value,cost:+tc.value||0,status:"Open"});save();tm.classList.remove("open");render()}
function toggle(id){let p=db.projects.find(x=>x.id==sel),t=p.tasks.find(x=>x.id==id);t.status=t.status=="Done"?"Open":"Done";save();render()}function next(){let p=db.projects.find(x=>x.id==sel),i=stages.indexOf(p.status);if(i<5)p.status=stages[i+1];save();render()}
function render(){list.innerHTML=db.projects.length?db.projects.map(p=>`<div class="project ${sel==p.id?"active":""}" onclick="sel='${p.id}';render()"><b>${p.id}</b><div>${p.name}</div><small class="muted">${p.client} · ${p.status}</small></div>`).join(""):'<span class="muted">ยังไม่มี Project</span>';let p=db.projects.find(x=>x.id==sel);if(p){let tc=p.tasks.reduce((s,t)=>s+t.cost,0);detail.innerHTML=`<div class="row"><div><small class="muted">${p.id}</small><h2>${p.name}</h2><span class="muted">${p.client} · ${p.type} · ${p.date||"-"} · ${p.venue||"-"}</span></div><button class="btn green" onclick="next()">Next Stage →</button></div><div class="workflow">${stages.map((s,i)=>`<div class="step ${i<stages.indexOf(p.status)?"done":s==p.status?"current":""}">${s}</div>`).join("")}</div><div class="grid"><div class="card"><h3>Project Brief</h3>${p.brief||'<span class="muted">ยังไม่มี Brief</span>'}<p class="muted">Quotation: ${p.q||"-"}</p></div><div class="card"><h3>Financial</h3><div class="money">${M(p.value)}</div><p>Estimated Cost: ${M(p.cost+tc)}</p><b>Projected Margin: ${M(p.value-p.cost-tc)}</b></div></div><div class="row"><h3>Production Tasks</h3><button class="btn red" onclick="addTask()">+ Add Task</button></div><div style="overflow:auto"><table><tr><th>Task</th><th>Department</th><th>Owner</th><th>Due</th><th>Cost</th><th>Status</th></tr>${p.tasks.length?p.tasks.map(t=>`<tr><td>${t.name}</td><td>${t.dept}</td><td>${t.owner||"-"}</td><td>${t.due||"-"}</td><td>${M(t.cost)}</td><td><button class="btn" onclick="toggle(${t.id})">${t.status}</button></td></tr>`).join(""):'<tr><td colspan="6" class="muted">ยังไม่มี Task — แตกงาน Creative / Production / Operation / Supplier / Staff / Finance ได้ที่นี่</td></tr>'}</table></div>`}let ts=db.projects.flatMap(p=>p.tasks);sp.textContent=db.projects.length;sa.textContent=db.projects.filter(p=>p.status!="Completed").length;st.textContent=ts.filter(t=>t.status!="Done").length;sv.textContent=M(db.projects.reduce((s,p)=>s+p.value,0));sc.textContent=M(db.projects.reduce((s,p)=>s+p.cost+p.tasks.reduce((a,t)=>a+t.cost,0),0))}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Jadedragon_Event_OS_V1_3_Backup.json";a.click()}render();
</script></body></html>
