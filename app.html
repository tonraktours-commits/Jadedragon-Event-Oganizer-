<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadedragon Event OS V1.2</title>
<style>
:root{--bg:#090a0d;--panel:#111318;--line:#2b3038;--text:#f5f6f8;--muted:#9ca3ad;--red:#e31822;--green:#2f9e67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;background:#0b0c0f;border-bottom:1px solid var(--line);z-index:5}.topin{max-width:1450px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:var(--red)}.sub{font-size:11px;color:var(--muted)}.btn{border:1px solid #3b414a;background:#171a20;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.btn.red{background:var(--red);border-color:var(--red)}.btn.green{background:var(--green);border-color:var(--green)}.shell{max-width:1450px;margin:auto;padding:20px 18px 50px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi b{font-size:25px}.kpi span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{background:#101216;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}.board{display:grid;grid-template-columns:340px 1fr;gap:14px}.pane{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:650px}.panehead{padding:16px;border-bottom:1px solid var(--line)}.lead{padding:13px 15px;border-bottom:1px solid #23272e;cursor:pointer}.lead.active,.lead:hover{background:#181b21}.id{color:#ff6f75;font-size:11px}.name{font-weight:700;margin:4px 0}.meta{font-size:11px;color:var(--muted);line-height:1.5}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#242830;font-size:10px;margin-top:6px}.body{padding:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#0d0f13;border:1px solid var(--line);border-radius:15px;padding:15px}.box h3{margin:0 0 12px}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;color:#bcc2ca}.field input,.field select,.field textarea{width:100%;background:#090b0e;border:1px solid #30363e;color:white;border-radius:9px;padding:9px}.field textarea{min-height:85px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qtable{width:100%;border-collapse:collapse}.qtable th,.qtable td{padding:7px 5px;border-bottom:1px solid #272c34;font-size:11px;text-align:left}.qtable input{width:100%;background:#090b0e;color:white;border:1px solid #333943;border-radius:7px;padding:6px}.right{text-align:right!important}.totals{max-width:320px;margin:12px 0 0 auto}.totals div{display:flex;justify-content:space-between;padding:5px 0;color:#c8ccd3}.totals .grand{font-weight:800;color:white;border-top:1px solid #4a5059;padding-top:9px;font-size:17px}.workflow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.step{border:1px solid #30363f;border-radius:9px;padding:9px;text-align:center;font-size:10px;color:#8f96a0}.step.done{background:#102219;color:#a7dfba}.step.current{background:#271719;color:#ffb5b9}.empty{display:grid;place-items:center;min-height:500px;color:var(--muted);text-align:center;padding:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.doc{background:white;color:#111;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:28px}.doc table{width:100%;border-collapse:collapse}.doc th,.doc td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{display:none;background:#102219;border:1px solid #24563a;color:#a9dfbb;padding:9px;border-radius:9px;margin-bottom:10px}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.workflow{grid-template-columns:repeat(4,1fr)}}@media(max-width:580px){.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.shell{padding:12px}.workflow{grid-template-columns:repeat(2,1fr)}}@media print{body>*:not(.modal){display:none!important}.modal{display:block!important;position:static;background:white;padding:0}.doc{max-height:none;padding:0}.printHide{display:none!important}}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">JADE<span>DRAGON</span> EVENT OS</div><div class="sub">V1.2 · Event Brief → Lead → Quotation → Project</div></div><div><a class="btn" href="index.html">Public Website</a> <button class="btn" id="exportBtn">Export Backup</button></div></div></header>
<main class="shell"><div class="kpis"><div class="kpi"><b id="kAll">0</b><span>Leads ทั้งหมด</span></div><div class="kpi"><b id="kNew">0</b><span>New Lead</span></div><div class="kpi"><b id="kQuote">0</b><span>Quotation</span></div><div class="kpi"><b id="kProject">0</b><span>Projects</span></div><div class="kpi"><b id="kValue">฿0</b><span>Pipeline Value</span></div></div>
<div class="toolbar"><input id="search" placeholder="ค้นหา Lead ID / ลูกค้า / บริษัท"><select id="filter"><option value="">ทุกสถานะ</option><option>New Lead</option><option>Contacted</option><option>Site Survey</option><option>Quotation</option><option>Negotiation</option><option>Confirmed</option><option>Project</option><option>Completed</option><option>Lost</option></select><button class="btn red" id="newLead">+ New Lead</button></div>
<div class="board"><aside class="pane"><div class="panehead"><b>Leads / Projects</b><div class="meta">เลือก Lead เพื่อเปิดรายละเอียด</div></div><div id="leadList"></div></aside><section class="pane" id="detail"><div class="empty"><div><h2>Jadedragon Event OS V1.2</h2><p>เริ่มจาก Event Brief บนหน้าเว็บไซต์ หรือสร้าง Lead ใหม่ที่นี่</p></div></div></section></div></main>
<div class="modal" id="modal"><div class="doc"><div class="actions printHide" style="justify-content:flex-end;margin-bottom:12px"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" id="closeModal">Close</button></div><div id="quoteDoc"></div></div></div>
<script>
const KEY='jadedragon_leads',STEPS=['New Lead','Contacted','Site Survey','Quotation','Negotiation','Confirmed','Project','Completed'];let selected=null;
const get=()=>JSON.parse(localStorage.getItem(KEY)||'[]'),save=x=>localStorage.setItem(KEY,JSON.stringify(x)),money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nextId(){const d=new Date(),ym=String(d.getFullYear()).slice(-2)+String(d.getMonth()+1).padStart(2,'0'),n=Number(localStorage.getItem('jd_lead_seq')||0)+1;localStorage.setItem('jd_lead_seq',n);return `JD-L${ym}-${String(n).padStart(4,'0')}`}
function calc(q){if(!q)return{sub:0,disc:0,vat:0,grand:0};const sub=(q.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),disc=+q.discount||0,base=Math.max(0,sub-disc),vat=q.vat?base*.07:0;return{sub,disc,vat,grand:base+vat}}
function update(id,fn){const a=get(),i=a.findIndex(x=>x.id===id);if(i<0)return;fn(a[i]);a[i].updatedAt=new Date().toISOString();save(a)}
function renderK(){const a=get();kAll.textContent=a.length;kNew.textContent=a.filter(x=>x.status==='New Lead').length;kQuote.textContent=a.filter(x=>x.quote).length;kProject.textContent=a.filter(x=>x.status==='Project'||x.status==='Completed'||x.project).length;kValue.textContent=money(a.reduce((s,x)=>s+calc(x.quote).grand,0))}
function renderList(){const q=search.value.toLowerCase(),f=filter.value,a=get().filter(x=>(!f||x.status===f)&&(!q||[x.id,x.name,x.company,x.phone].join(' ').toLowerCase().includes(q)));leadList.innerHTML=a.length?a.map(x=>`<div class="lead ${x.id===selected?'active':''}" data-id="${x.id}"><div class="id">${esc(x.id)}</div><div class="name">${esc(x.name||'-')}</div><div class="meta">${esc(x.company||'')}<br>${esc(x.type||'')}</div><span class="badge">${esc(x.status||'New Lead')}</span></div>`).join(''):'<div class="empty" style="min-height:230px">ยังไม่มีข้อมูล</div>';document.querySelectorAll('.lead').forEach(e=>e.onclick=()=>{selected=e.dataset.id;renderAll()})}
function F(label,name,val,type='text'){return `<div class="field"><label>${label}</label><input data-field="${name}" type="${type}" value="${esc(val)}"></div>`}
function renderDetail(){const x=get().find(i=>i.id===selected);if(!x){detail.innerHTML='<div class="empty"><div><h2>Jadedragon Event OS V1.2</h2><p>เลือก Lead ทางซ้าย</p></div></div>';return}let q=x.quote||{quoteNo:'Q-'+x.id.replace('JD-L',''),date:new Date().toISOString().slice(0,10),items:[{desc:'Event Management / Organizer',qty:1,price:0}],discount:0,vat:true,terms:'เงื่อนไขการชำระเงินและระยะเวลายืนราคาตามที่ตกลง'};const c=calc(q),ci=STEPS.indexOf(x.status);
 detail.innerHTML=`<div class="panehead"><div class="id">${x.id}</div><h2 style="margin:4px 0">${esc(x.name||'-')} ${x.company?'· '+esc(x.company):''}</h2><div class="meta">${new Date(x.createdAt).toLocaleString('th-TH')}</div></div><div class="body"><div class="notice" id="notice">บันทึกแล้ว</div><div class="cols"><div class="box"><h3>Lead Information</h3><div class="row">${F('ชื่อ / Name','name',x.name)}${F('บริษัท','company',x.company)}</div><div class="row">${F('โทรศัพท์','phone',x.phone)}${F('Email','email',x.email,'email')}</div><div class="row"><div class="field"><label>สถานะ</label><select data-field="status">${['New Lead','Contacted','Site Survey','Quotation','Negotiation','Confirmed','Project','Completed','Lost'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${F('ประเภทงาน','type',x.type)}</div>${F('Budget','budget',x.budget)}<div class="field"><label>รายละเอียด Brief</label><textarea data-field="details">${esc(x.details)}</textarea></div><button class="btn green" id="saveLead">Save Lead</button></div>
 <div class="box"><h3>Quotation</h3><div class="row">${F('Quotation No.','qno',q.quoteNo)}${F('Date','qdate',q.date,'date')}</div><table class="qtable"><thead><tr><th>รายการ</th><th style="width:65px">Qty</th><th style="width:120px">ราคา</th><th class="right">รวม</th><th></th></tr></thead><tbody id="qrows">${q.items.map((i,n)=>`<tr><td><input data-desc="${n}" value="${esc(i.desc)}"></td><td><input data-qty="${n}" type="number" value="${i.qty}"></td><td><input data-price="${n}" type="number" value="${i.price}"></td><td class="right">${money(i.qty*i.price)}</td><td><button class="btn" data-del="${n}">×</button></td></tr>`).join('')}</tbody></table><button class="btn" id="addItem">+ Add Item</button><div class="row" style="margin-top:10px">${F('ส่วนลด','discount',q.discount,'number')}<div class="field"><label>VAT</label><select id="vat"><option value="1" ${q.vat?'selected':''}>VAT 7%</option><option value="0" ${!q.vat?'selected':''}>ไม่คิด VAT</option></select></div></div><div class="field"><label>เงื่อนไข</label><textarea id="terms">${esc(q.terms)}</textarea></div><div class="totals"><div><span>Subtotal</span><span>${money(c.sub)}</span></div><div><span>Discount</span><span>${money(c.disc)}</span></div><div><span>VAT</span><span>${money(c.vat)}</span></div><div class="grand"><span>Grand Total</span><span>${money(c.grand)}</span></div></div><div class="actions" style="margin-top:12px"><button class="btn red" id="saveQ">Save Quotation</button><button class="btn" id="previewQ">Preview / PDF</button><button class="btn green" id="toProject">Convert to Project</button></div></div></div><div class="box" style="margin-top:12px"><h3>Workflow</h3><div class="workflow">${STEPS.map((s,i)=>`<div class="step ${i<ci?'done':i===ci?'current':''}">${i+1}. ${s}</div>`).join('')}</div></div></div>`;wire(x,q)}
function collect(q){q.quoteNo=document.querySelector('[data-field=qno]').value;q.date=document.querySelector('[data-field=qdate]').value;q.discount=+document.querySelector('[data-field=discount]').value||0;q.vat=vat.value==='1';q.terms=terms.value;q.items=[...qrows.querySelectorAll('tr')].map((tr,n)=>({desc:tr.querySelector(`[data-desc="${n}"]`)?.value||'',qty:+tr.querySelector(`[data-qty="${n}"]`)?.value||0,price:+tr.querySelector(`[data-price="${n}"]`)?.value||0}));return q}
function wire(x,q){saveLead.onclick=()=>{update(x.id,o=>document.querySelectorAll('[data-field]').forEach(e=>{if(!['qno','qdate','discount'].includes(e.dataset.field))o[e.dataset.field]=e.value}));renderAll()};addItem.onclick=()=>{q=collect(q);q.items.push({desc:'',qty:1,price:0});update(x.id,o=>o.quote=q);renderAll()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{q=collect(q);q.items.splice(+b.dataset.del,1);update(x.id,o=>o.quote=q);renderAll()});saveQ.onclick=()=>{q=collect(q);update(x.id,o=>{o.quote=q;if(['New Lead','Contacted','Site Survey'].includes(o.status))o.status='Quotation'});renderAll()};previewQ.onclick=()=>showDoc(x,collect(q));toProject.onclick=()=>{q=collect(q);update(x.id,o=>{o.quote=q;o.status='Project';o.project=o.project||{projectId:'P-'+o.id.replace('JD-L',''),createdAt:new Date().toISOString(),stage:'Planning'}});renderAll()}}
function showDoc(x,q){const c=calc(q);quoteDoc.innerHTML=`<div style="display:flex;justify-content:space-between"><div><h1>JADEDRAGON</h1><div>Event • Creative • Production</div></div><div style="text-align:right"><b>QUOTATION</b><br>${esc(q.quoteNo)}<br>${esc(q.date)}</div></div><hr><p><b>ลูกค้า:</b> ${esc(x.name)} ${x.company?' / '+esc(x.company):''}<br><b>โทร:</b> ${esc(x.phone)} &nbsp; <b>Email:</b> ${esc(x.email)}</p><table><thead><tr><th>#</th><th>รายละเอียด</th><th>Qty</th><th>ราคา/หน่วย</th><th>รวม</th></tr></thead><tbody>${q.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.desc)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div class="totals" style="color:#111"><div><span>Subtotal</span><span>${money(c.sub)}</span></div><div><span>Discount</span><span>${money(c.disc)}</span></div><div><span>VAT 7%</span><span>${money(c.vat)}</span></div><div class="grand" style="color:#111"><span>Grand Total</span><span>${money(c.grand)}</span></div></div><h4>เงื่อนไข</h4><p>${esc(q.terms).replace(/\n/g,'<br>')}</p>`;modal.classList.add('open')}
function renderAll(){renderK();renderList();renderDetail()}search.oninput=renderList;filter.onchange=renderList;newLead.onclick=()=>{const id=nextId(),a=get();a.unshift({id,name:'New Lead',company:'',phone:'',email:'',type:'',budget:'',details:'',status:'New Lead',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),quote:null,project:null});save(a);selected=id;renderAll()};closeModal.onclick=()=>modal.classList.remove('open');exportBtn.onclick=()=>{const b=new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jadedragon-event-os-backup.json';a.click();URL.revokeObjectURL(a.href)};renderAll();
</script></body></html>
