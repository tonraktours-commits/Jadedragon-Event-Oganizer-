<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadedragon Event Organizer - CMS with Members</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #e74c3c;
            --primary-dark: #c0392b;
            --text-dark: #2c3e50;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 10px 40px rgba(0, 0, 0, 0.15);
            --success: #27ae60;
            --danger: #e74c3c;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-hover);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            color: var(--text-dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        /* Admin Controls */
        .admin-controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        /* Header */
        header {
            background: var(--bg-white);
            padding: 1rem 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .logo span {
            color: var(--primary-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
        }

        .user-dropdown {
            position: absolute;
            top: 60px;
            right: 1rem;
            background: white;
            border-radius: 4px;
            box-shadow: var(--shadow);
            min-width: 200px;
            display: none;
            z-index: 1001;
        }

        .user-dropdown.active {
            display: block;
        }

        .user-dropdown a,
        .user-dropdown button {
            display: block;
            width: 100%;
            padding: 0.8rem 1rem;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .user-dropdown a:hover,
        .user-dropdown button:hover {
            background: var(--bg-light);
            color: var(--primary-color);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 7rem 0;
            text-align: center;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .hero-content p {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* Services Section */
        .services {
            padding: 5rem 0;
            background: var(--bg-white);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--primary-color);
            margin: 1rem auto 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--bg-light);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
            border-top: 3px solid transparent;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-top-color: var(--primary-color);
        }

        .service-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .service-card h3 {
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .service-card p {
            color: var(--text-light);
        }

        /* Portfolio Section */
        .portfolio {
            padding: 5rem 0;
            background: var(--bg-light);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .portfolio-item {
            background: var(--bg-white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .portfolio-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        .portfolio-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            position: relative;
        }

        .portfolio-favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portfolio-favorite.liked {
            color: var(--danger);
        }

        .portfolio-info {
            padding: 1.5rem;
        }

        .portfolio-info h3 {
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .portfolio-info p {
            color: #999;
            font-size: 0.9rem;
        }

        /* Booking Section */
        .booking {
            padding: 5rem 0;
            background: var(--bg-white);
        }

        .booking-form {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-light);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        /* Member Dashboard */
        .member-dashboard {
            padding: 3rem 0;
            background: var(--bg-light);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .dashboard-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .dashboard-card h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .booking-history {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .booking-item {
            padding: 1rem;
            border-left: 3px solid var(--primary-color);
            margin-bottom: 1rem;
            background: var(--bg-light);
            border-radius: 4px;
        }

        .booking-item.pending {
            border-left-color: #f39c12;
        }

        .booking-item.confirmed {
            border-left-color: var(--success);
        }

        .booking-item.cancelled {
            border-left-color: var(--danger);
        }

        /* Contact Section */
        .contact {
            padding: 5rem 0;
            background: var(--text-dark);
            color: white;
        }

        .contact .section-title {
            color: white;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 8px;
        }

        .contact-item h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .contact-item a {
            color: inherit;
            text-decoration: none;
        }

        .contact-item a:hover {
            color: var(--primary-color);
        }

        /* Footer */
        footer {
            background: #1a252f;
            color: #bdc3c7;
            text-align: center;
            padding: 2rem 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            box-shadow: var(--shadow-hover);
            z-index: 3000;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2rem;
            }

            nav ul {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .admin-controls {
                flex-direction: column;
                gap: 0.3rem;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            overflow-y: auto;
        }

        .admin-panel.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-content {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
        }

        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--bg-light);
        }

        .admin-tab {
            background: none;
            border: none;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .admin-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .item-list {
            margin-top: 1rem;
        }

        .item-row {
            background: white;
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-row button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <!-- Admin Controls -->
    <div class="admin-controls">
        <button class="btn btn-secondary" id="adminToggle" onclick="toggleAdminPanel()">🔧 Admin</button>
        <button class="btn btn-secondary" id="loginToggle" onclick="toggleLoginModal()">👤 Login</button>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-content">
            <div class="modal-header">
                <h2>Admin Dashboard</h2>
                <button class="close-btn" onclick="toggleAdminPanel()">✕</button>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchAdminTab('business')">ข้อมูลธุรกิจ</button>
                <button class="admin-tab" onclick="switchAdminTab('services')">บริการ</button>
                <button class="admin-tab" onclick="switchAdminTab('portfolio')">ผลงาน</button>
                <button class="admin-tab" onclick="switchAdminTab('members')">สมาชิก</button>
                <button class="admin-tab" onclick="switchAdminTab('bookings')">การจอง</button>
            </div>

            <!-- Business Tab -->
            <div class="admin-section active" id="business-tab">
                <h3>ข้อมูลธุรกิจ</h3>
                <div class="form-group">
                    <label>ชื่อบริษัท</label>
                    <input type="text" id="businessName">
                </div>
                <div class="form-group">
                    <label>สโลแกน</label>
                    <input type="text" id="businessSlogan">
                </div>
                <button class="btn btn-primary" onclick="saveBusinessInfo()">บันทึก</button>
            </div>

            <!-- Services Tab -->
            <div class="admin-section" id="services-tab">
                <h3>จัดการบริการ</h3>
                <div class="form-group">
                    <label>ไอคอน</label>
                    <input type="text" id="serviceIcon" placeholder="emoji">
                </div>
                <div class="form-group">
                    <label>ชื่อบริการ</label>
                    <input type="text" id="serviceName">
                </div>
                <div class="form-group">
                    <label>คำอธิบาย</label>
                    <textarea id="serviceDescription"></textarea>
                </div>
                <button class="btn btn-primary" onclick="addService()">เพิ่มบริการ</button>
                <div class="item-list" id="servicesList"></div>
            </div>

            <!-- Portfolio Tab -->
            <div class="admin-section" id="portfolio-tab">
                <h3>จัดการผลงาน</h3>
                <div class="form-group">
                    <label>ไอคอน</label>
                    <input type="text" id="portfolioIcon" placeholder="emoji">
                </div>
                <div class="form-group">
                    <label>ชื่องาน</label>
                    <input type="text" id="portfolioTitle">
                </div>
                <div class="form-group">
                    <label>คำอธิบาย</label>
                    <textarea id="portfolioDescription"></textarea>
                </div>
                <button class="btn btn-primary" onclick="addPortfolio()">เพิ่มผลงาน</button>
                <div class="item-list" id="portfolioList"></div>
            </div>

            <!-- Members Tab -->
            <div class="admin-section" id="members-tab">
                <h3>จัดการสมาชิก</h3>
                <div class="item-list" id="membersList"></div>
            </div>

            <!-- Bookings Tab -->
            <div class="admin-section" id="bookings-tab">
                <h3>จัดการการจอง</h3>
                <div class="item-list" id="bookingsList"></div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
